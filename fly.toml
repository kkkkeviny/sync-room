# Fly.io 配置
# 1. 把下面的 app 名字改成全球唯一的（例如 sync-room-你的名字）
# 2. fly launch --copy-config --no-deploy
# 3. fly deploy
app = "sync-room-change-me"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
